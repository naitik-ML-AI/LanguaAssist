name: Daily Activity Log

on:
  schedule:
    # Runs every day at 20:00 IST (14:30 UTC)
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-activity-log:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add daily activity entry
        run: |
          mkdir -p activity-log
          DATE="$(date -u +%F)"
          FILE="activity-log/${DATE}.md"
          if [ ! -f "$FILE" ]; then
            {
              echo "# Daily Activity — ${DATE}"
              echo
              echo "Automated repository maintenance entry."
              echo
              echo "- Workflow ran successfully."
            } > "$FILE"
          fi

      - name: Commit and push if there is a change
        run: |
          git add activity-log/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: add daily activity log"
            git push
          fi
